ingress:
  enabled: true
  className: nginx
  hosts:
    ui: providentia.kanemullett.com
    api: api.providentia.kanemullett.com
    auth: auth.providentia.kanemullett.com
  tls:
    enabled: true
    secretName: providentia-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

api:
  image:
    repository: ghcr.io/kanemullett/api
    tag: latest
  env:
    POSTGRES_HOST: private-providentia-db-do-user-32942855-0.f.db.ondigitalocean.com
    POSTGRES_PORT: "25060"
    POSTGRES_DB: defaultdb
    POSTGRES_SSLMODE: require
    CORS_ORIGINS: "https://providentia.kanemullett.com,http://providentia.kanemullett.com"
  secret:
    create: false
    name: predictor-api-secret

ui:
  image:
    repository: ghcr.io/kanemullett/ui
    tag: latest

keycloak:
  # Off until the production setup in the README is done (keycloak database, DNS, secret).
  enabled: false
  # Same managed Postgres cluster as the API, in its own database.
  db:
    host: private-providentia-db-do-user-32942855-0.f.db.ondigitalocean.com
    port: 25060
    database: keycloak
    sslmode: require
  secret:
    name: predictor-keycloak-secret
