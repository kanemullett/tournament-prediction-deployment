api:
  image:
    repository: ghcr.io/kanemullett/api
    # Prefer pinning an immutable tag (e.g. the git SHA) and setting pullPolicy: IfNotPresent.
    # With a mutable tag like latest, Always is needed for nodes to pick up new pushes.
    tag: latest
    pullPolicy: Always
  # Container port; matches server.port in the API's application.properties.
  port: 8000
  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi

  env:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: predictor
    # disable | allow | prefer | require | verify-ca | verify-full. The API defaults to prefer when unset.
    POSTGRES_SSLMODE: ""
    CORS_ORIGINS: "https://providentia.kanemullett.com,http://providentia.kanemullett.com,http://localhost:3000,http://127.0.0.1:3000"

  secret:
    create: false
    name: predictor-api-secret

ui:
  image:
    repository: ghcr.io/kanemullett/ui
    tag: latest
    pullPolicy: Always
  containerPort: 80
  replicas: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    ui: providentia.kanemullett.com
    api: api.providentia.kanemullett.com
  tls:
    enabled: true
    secretName: providentia-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
