apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "predictor.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "predictor.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "predictor.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "predictor.fullname" . }}-api
            - secretRef:
                {{- if .Values.api.secret.create }}
                name: {{ include "predictor.fullname" . }}-api
                {{- else }}
                name: {{ .Values.api.secret.name | quote }}
                {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Covers JVM startup and Flyway migrations; liveness/readiness only start once this passes.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
