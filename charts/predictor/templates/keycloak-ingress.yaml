{{- if and .Values.ingress.enabled .Values.keycloak.enabled }}
# Separate from the app ingress so the larger proxy buffers (Keycloak sends big headers)
# and the certificate only apply to the auth host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "predictor.fullname" . }}-keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.auth | quote }}
      http:
        paths:
          {{- $paths := list "/realms/" "/resources/" }}
          {{- if .Values.keycloak.ingress.exposeAdmin }}
          {{- $paths = append $paths "/admin/" }}
          {{- end }}
          {{- range $paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "predictor.fullname" $ }}-keycloak
                port:
                  number: 80
          {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.keycloak.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.hosts.auth }}
  {{- end }}
{{- end }}
