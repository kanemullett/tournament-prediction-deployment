{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "predictor.fullname" . }}-keycloak
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: {{ include "predictor.fullname" . }}-keycloak
  template:
    metadata:
      labels:
        app: {{ include "predictor.fullname" . }}-keycloak
      annotations:
        # Restart when config changes. The realm is only imported if it doesn't exist yet,
        # so realm file changes after the first install must be applied in the admin console.
        checksum/config: {{ include (print $.Template.BasePath "/keycloak-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: {{ include "predictor.fullname" . }}-keycloak
            - secretRef:
                name: {{ .Values.keycloak.secret.name | quote }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- with .Values.keycloak.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The stock image builds its config on every start, so give it a few minutes.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: {{ include "predictor.fullname" . }}-keycloak-realm
{{- end }}
